name: testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: pytest (Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-dev.txt

      - name: Instalar o pacote e as dependências de teste
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Rodar os testes
        shell: pwsh
        # A máquina do CI não tem tela nem área de transferência de verdade,
        # então tudo que for marcado como `gui` ou `sistema` fica de fora.
        # Ver os marcadores em pyproject.toml e o porquê em CONTRIBUINDO.md.
        run: |
          pytest -m "not gui and not sistema"
          if ($LASTEXITCODE -eq 5) {
            Write-Host "::notice::Nenhum teste coletado com este filtro. Não é falha."
            exit 0
          }
          exit $LASTEXITCODE

  empacotamento:
    name: o pacote instala com os dados dentro
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Construir o wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      # O erro clássico de empacotamento é o wheel sair sem os arquivos de
      # `dados/`: instala liso e quebra na primeira execução. Este passo existe
      # para esse bug nunca chegar na main.
      - name: Conferir que o dicionário e os ícones entraram no wheel
        shell: python
        run: |
          import glob, sys, zipfile

          obrigatorios = [
              "corretor/dados/dicionario.json.gz",
              "corretor/dados/icone.ico",
              "corretor/dados/icone_pausado.ico",
          ]

          wheels = glob.glob("dist/*.whl")
          if not wheels:
              sys.exit("Nenhum wheel foi gerado em dist/.")

          dentro = set(zipfile.ZipFile(wheels[0]).namelist())
          print("Conteúdo do wheel:")
          for nome in sorted(dentro):
              print("  ", nome)

          faltando = [f for f in obrigatorios if f not in dentro]
          if faltando:
              sys.exit(
                  "Estes arquivos NÃO entraram no wheel: "
                  + ", ".join(faltando)
                  + "\nConfira [tool.setuptools.package-data] no pyproject.toml."
              )
          print("\nOK: todos os dados obrigatórios estão no wheel.")

      - name: Instalar o wheel e conferir que os dados chegam instalados
        shell: pwsh
        run: |
          $whl = (Get-ChildItem dist/*.whl | Select-Object -First 1).FullName
          pip install --no-deps $whl
          python -c "from corretor import DADOS; import sys; faltando=[n for n in ['dicionario.json.gz','icone.ico'] if not (DADOS/n).is_file()]; sys.exit('Faltando depois de instalar: '+str(faltando)) if faltando else print('OK: dados acessíveis em', DADOS)"
